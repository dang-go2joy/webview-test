<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .spacer { height: 80vh; background: #eee; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; }
        input { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #007bff; border-radius: 8px; }
        .padding-bottom { height: 50vh; }
    </style>
</head>
<body>
    <h2>Trình Test Cuộn Bàn Phím</h2>
    <div class="spacer">Cuộn xuống dưới cùng</div>
    
    <div class="input-box">
        <label>Nhập thử vào đây:</label><br><br>
        <input type="text" id="target-input" placeholder="Chạm để hiện bàn phím...">
    </div>

    <div class="padding-bottom"></div>

    <script>
        const input = document.getElementById('target-input');
        input.addEventListener('focus', () => {
            setTimeout(() => {
                input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });
    </script>
</body>
</html>
